<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menüplan</title>
  <meta name="description" content="Wochenmenüs planen und Einkaufsliste nach Kategorien abhaken">
  <meta name="theme-color" content="#2e7d4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="viewTitle">Wochenplan</h1>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" fill-rule="evenodd" d="M10.09 4.03 L10.36 1.63 L13.64 1.63 L13.91 4.03 L16.28 5.01 L18.17 3.51 L20.49 5.83 L18.99 7.72 L19.97 10.09 L22.37 10.36 L22.37 13.64 L19.97 13.91 L18.99 16.28 L20.49 18.17 L18.17 20.49 L16.28 18.99 L13.91 19.97 L13.64 22.37 L10.36 22.37 L10.09 19.97 L7.72 18.99 L5.83 20.49 L3.51 18.17 L5.01 16.28 L4.03 13.91 L1.63 13.64 L1.63 10.36 L4.03 10.09 L5.01 7.72 L3.51 5.83 L5.83 3.51 L7.72 5.01 Z M8.7 12 a3.3 3.3 0 1 0 6.6 0 a3.3 3.3 0 1 0 -6.6 0 Z"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="bottomnav">
    <button data-tab="plan" class="active">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zm-2 8h14v10H5z"/></svg>
      <span>Wochenplan</span>
    </button>
    <button data-tab="recipes">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1 4v2h10V6zm0 4v2h10v-2zm0 4v2h7v-2z"/></svg>
      <span>Rezepte</span>
    </button>
    <button data-tab="shop">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5.2 4H2V2h4.6l.9 2H21l-3.4 8H8.1l-.9 2H19v2H4l2.2-4.3z"/></svg>
      <span>Einkauf</span>
      <b class="badge" id="shopBadge" hidden></b>
    </button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Schliessen">&times;</button>
      </div>
      <div id="modalBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="photoInput" accept="image/*" hidden>

  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
